[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constructive-alignment-auditor"
version = "0.1.0"
description = "Transparent rule baseline for reviewing Bloom-level and lexical relationships among outcomes, activities, and assessments."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = [
  "ai-in-education",
  "aied",
  "constructive-alignment",
  "instructional-design",
  "curriculum-design",
  "bloom-taxonomy",
]

[project.urls]
Repository = "https://github.com/devissaputra/constructive_alignment_auditor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
