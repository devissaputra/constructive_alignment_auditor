<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Constructive Alignment Auditor demo snapshot</title>
<desc id="desc">Synthetic example showing detected Bloom levels and the generated assessment-above-outcome review flag.</desc>
<rect width="1200" height="300" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Demo snapshot</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">Output from the bundled synthetic example. These are not research results.</text>

<rect x="52" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Outcome level</text>
<text x="70" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">analyze</text>

<rect x="330" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="348" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Activity level</text>
<text x="348" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">analyze · gap 0</text>

<rect x="608" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="626" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Assessment level</text>
<text x="626" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">evaluate · gap +1</text>

<rect x="886" y="112" width="262" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
