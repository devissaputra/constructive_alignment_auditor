<text x="904" y="172" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">assessment_above_outcome</text>

<text x="52" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py</text>
